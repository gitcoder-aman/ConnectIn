POST_SERVICE_URI: http://post-service
CONNECTION_SERVICE_URI: http://connections-service
NOTIFICATION_SERVICE_URI: http://notification-service

management:
  endpoint:
    web:
      exposure:
        include: "health,info"

jwt:
  secretKey: ${JWT_SECRET_KEY}

