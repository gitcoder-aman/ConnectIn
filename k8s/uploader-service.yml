apiVersion: v1
kind: Secret
metadata:
  name: cloudinary-secret
type: Opaque
stringData:
  CLOUD_NAME: "drsrdkhn7"
  API_KEY: "567275729665999"
  API_SECRET: "HyMdGjnOfnx3GmLdLmmzV-FiduI"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploader-service
spec:
  selector:
    matchLabels:
      app: uploader-service
  template:
    metadata:
      labels:
        app: uploader-service

    spec:
      containers:
      - name: uploader-service
        image: aman06383/connectin-app-uploader-service
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
        
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
        envFrom:
          - secretRef:
              name: cloudinary-secret
        ports:
        - containerPort: 9050
---
apiVersion: v1
kind: Service
metadata:
  name: uploader-service
spec:
  selector:
    app: uploader-service
  ports:
  - port: 80
    targetPort: 9050

        
      
