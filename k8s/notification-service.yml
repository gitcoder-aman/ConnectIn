apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
      - name: notification-service
        image: aman06383/connectin-app-notification-service
        imagePullPolicy: Always
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
        
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: DB_USERNAME
            value: user
          - name: DB_PASSWORD
            value: "3092"
          - name: DB_SERVER
            value: notification-db
          - name: DB_NAME
            value: notificationDB
        ports:
        - containerPort: 9040
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - port: 80
    targetPort: 9040

        
      
