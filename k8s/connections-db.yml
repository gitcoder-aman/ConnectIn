apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: connections-db
spec:
  serviceName: connections-db
  replicas: 1

  selector:
    matchLabels:
      app: connections-db

  template:
    metadata:
      labels:
        app: connections-db

    spec:
      containers:
        - name: connections-db
          image: neo4j:5.26.3-community

          ports:
            - containerPort: 7687
              name: bolt

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          env:
            - name: NEO4J_AUTH
              value: "neo4j/1234567890"

            - name: NEO4J_server_memory_heap_initial__size
              value: "512M"

            - name: NEO4J_server_memory_heap_max__size
              value: "1G"

            - name: NEO4J_server_default__listen__address
              value: "0.0.0.0"

          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs

  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: neo4j-logs
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: connections-db
  labels:
    app: connections-db
spec:
  clusterIP: None
  selector:
    app: connections-db
  ports:
  - port: 7687
    targetPort: 7687
    name: bolt
