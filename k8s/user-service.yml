apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
      - name: user-service
        image: aman06383/connectin-app-user-service
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
        
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: JWT_SECRET_KEY
            value: "asfhjsadfjhsdafsdajhfjasdhgfsdahvfnmswjhrhiuewafkmnsadkfjsad"
          - name: DB_USERNAME
            value: user
          - name: DB_PASSWORD
            value: "3092"
          - name: DB_SERVER
            value: user-db
          - name: DB_NAME
            value: userDB
        ports:
        - containerPort: 9020
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 9020

        
      
