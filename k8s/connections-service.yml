apiVersion: apps/v1
kind: Deployment
metadata:
  name: connections-service
spec:
  selector:
    matchLabels:
      app: connections-service
  template:
    metadata:
      labels:
        app: connections-service

    spec:
      containers:
      - name: connections-service
        image: aman06383/connectin-app-connections-service
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
        
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: SPRING_DATA_NEO4J_DATABASE
            value: neo4j
          - name: DB_PASSWORD
            value: "1234567890"
          - name: DB_USERNAME
            value: neo4j
          - name: DB_NAME
            value: connections-db
        ports:
        - containerPort: 9030
---
apiVersion: v1
kind: Service
metadata:
  name: connections-service
spec:
  selector:
    app: connections-service
  ports:
  - port: 80
    targetPort: 9030

        
      
