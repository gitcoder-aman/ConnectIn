spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  config:
    import: classpath:kafka.yaml

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: 09876543

  data:
    neo4j:
      database: connectin-db

server:
  port: 9020
  servlet:
    context-path: /users

jwt:
  secretKey: ${JWT_SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
